name: Build APK

# Runs only when you press "Run workflow" on the Actions tab,
# so editing files one by one doesn't start a build each time.
on:
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Avoids install errors before versions are matched to the Expo SDK.
      npm_config_legacy_peer_deps: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install packages
        run: npm install

      - name: Match package versions to the Expo SDK
        run: npx expo install --fix

      - name: Show installed versions
        run: npm ls --depth=0 || true

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gst-billing-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

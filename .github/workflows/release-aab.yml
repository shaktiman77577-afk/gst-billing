name: Release AAB (Play Store)

# Builds the signed Android App Bundle (.aab) for Play Store upload.
# Needs the 4 secrets from "Generate upload keystore".
on:
  workflow_dispatch:

concurrency:
  group: release-aab
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      npm_config_legacy_peer_deps: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check secrets
        env:
          KS: ${{ secrets.GST_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "GST_UPLOAD_KEYSTORE_BASE64 secret is missing. Run 'Generate upload keystore' first."; exit 1
          fi

      - name: Install packages
        run: npm install

      - name: Match package versions to the Expo SDK
        run: npx expo install --fix

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Restore upload keystore
        env:
          KS: ${{ secrets.GST_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: Build signed AAB (all phone types)
        working-directory: android
        env:
          GST_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.keystore
          GST_UPLOAD_STORE_PASSWORD: ${{ secrets.GST_UPLOAD_STORE_PASSWORD }}
          GST_UPLOAD_KEY_ALIAS: ${{ secrets.GST_UPLOAD_KEY_ALIAS }}
          GST_UPLOAD_KEY_PASSWORD: ${{ secrets.GST_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Show upload key SHA-1 (must be in Firebase)
        env:
          GST_UPLOAD_STORE_PASSWORD: ${{ secrets.GST_UPLOAD_STORE_PASSWORD }}
          GST_UPLOAD_KEY_ALIAS: ${{ secrets.GST_UPLOAD_KEY_ALIAS }}
        run: keytool -list -v -keystore "$RUNNER_TEMP/upload.keystore" -storepass "$GST_UPLOAD_STORE_PASSWORD" -alias "${GST_UPLOAD_KEY_ALIAS:-upload}" | grep -E 'SHA1|SHA256'

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: gst-billing-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

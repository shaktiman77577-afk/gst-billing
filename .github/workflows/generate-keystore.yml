name: Generate upload keystore (run ONCE)

# Creates the Play Store upload key. Run this only one time, save the output
# safely (Google Drive + GitHub Secrets), then never run it again — a new key
# means you can no longer update the app on Play Store without Google support.
on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create keystore
        run: |
          set -e
          PASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore upload.keystore -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=GST Billing, OU=Mobile, O=GST Billing, L=Delhi, ST=Delhi, C=IN"
          base64 -w 0 upload.keystore > upload.keystore.base64
          {
            echo "Add these 4 GitHub Secrets (Settings > Secrets and variables > Actions):"
            echo ""
            echo "GST_UPLOAD_KEYSTORE_BASE64 = (the full contents of upload.keystore.base64)"
            echo "GST_UPLOAD_STORE_PASSWORD  = $PASS"
            echo "GST_UPLOAD_KEY_PASSWORD    = $PASS"
            echo "GST_UPLOAD_KEY_ALIAS       = upload"
            echo ""
            echo "Also keep upload.keystore + this file in Google Drive. Do not lose them."
          } > SECRETS.txt
          echo "---- Upload key fingerprints (add SHA-1 in Firebase) ----"
          keytool -list -v -keystore upload.keystore -storepass "$PASS" -alias upload | grep -E 'SHA1|SHA256'

      - name: Save keystore (download from this run, then delete the artifact)
        uses: actions/upload-artifact@v4
        with:
          name: upload-keystore-KEEP-PRIVATE
          path: |
            upload.keystore
            upload.keystore.base64
            SECRETS.txt
          retention-days: 1
